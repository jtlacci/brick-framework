# The review gate, for repositories built on this framework. Nothing here
# runs on the framework itself: this is a reusable workflow, and it does
# work only when another repository calls it. The caller adds one file:
#
#   # .github/workflows/review.yml
#   on: pull_request
#   jobs:
#     review:
#       uses: jtlacci/brick-framework/.github/workflows/review.yml@<commit-sha>
#       with:
#         framework-ref: <same-commit-sha>
#       secrets: inherit
#
# One model verdict per lane the pull request touches, each lane judged
# against review/<lane>.md (the caller's own file wins over the framework's).
# Routing is derived from brick lanes and the caller's workflows/ tree.
#
# Bend architecture verification always runs first. Without an ANTHROPIC_API_KEY secret only
# the model verdict is skipped, loudly; proof, compilation, and boundary lint
# remain mandatory. With the secret set, "not reviewed" is a failure -- see
# tools/review.py for the exit codes.
name: review

on:
  workflow_call:
    inputs:
      framework-ref:
        description: immutable framework revision to validate and review with
        type: string
        required: true
    secrets:
      ANTHROPIC_API_KEY:
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      BEND_VERSION: "2.0.5"
      BEND_SHA256: "4db70e77ce1b1027f1d0e15dee025921fa794a9b415add4350ec7c64acf2775b"
      BEND_NO_TELEMETRY: "1"
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Both ends of the PR range must be present for `git diff base...head`.
          fetch-depth: 0

      - name: require immutable framework revision
        env:
          FRAMEWORK_REF: ${{ inputs.framework-ref }}
        run: |
          if [[ ! "$FRAMEWORK_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "framework-ref must be a full 40-character commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: jtlacci/brick-framework
          ref: ${{ inputs.framework-ref }}
          path: .brick-framework

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: install pinned Bend
        run: |
          bend_home="$RUNNER_TEMP/bend"
          archive="$RUNNER_TEMP/bend-${BEND_VERSION}.tar.gz"
          curl -fsSL "https://bend-lang.com/dl/${BEND_VERSION}.tar.gz" -o "$archive"
          echo "${BEND_SHA256}  ${archive}" | sha256sum --check -
          mkdir -p "$bend_home" "$RUNNER_TEMP/bend-bin"
          tar -xzf "$archive" -C "$bend_home"
          echo "BEND_ENTRY=$bend_home/bend2/main.ts" >> "$GITHUB_ENV"
          printf '%s\n' '#!/usr/bin/env sh' 'exec bun "$BEND_ENTRY" "$@"' > "$RUNNER_TEMP/bend-bin/bend"
          chmod +x "$RUNNER_TEMP/bend-bin/bend"
          echo "$RUNNER_TEMP/bend-bin" >> "$GITHUB_PATH"

      - name: validate generated Bend architecture
        run: |
          test "$(bend --version)" = "bend $(cat .brick-framework/.bend-version)"
          python3 .brick-framework/tools/model_repository.py --root . --check
          bend PROOF.bend

      # The secrets context cannot gate a job, only a step. Validation above
      # is unconditional; this output gates only the optional model review.
      - id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::model review skipped: this repository has no ANTHROPIC_API_KEY secret"
            echo "## Model review skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Bend validation passed. No \`ANTHROPIC_API_KEY\` secret is configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.key.outputs.present == 'true'
        run: python3 -m pip install --quiet anthropic

      # Memory across rounds: the verdicts the last run of THIS PR uploaded.
      # `gh run download` refuses artifacts from other workflow runs, so the
      # artifact is found by name through the API and fetched as a zip. A
      # missing artifact is the first round, not an error.
      - name: restore previous verdicts
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: review-verdicts-pr-${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${NAME}&per_page=1" \
               --jq '.artifacts[0].id // empty')
          if [ -n "$id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > previous.zip \
              && unzip -o -q previous.zip -d previous \
              && echo "PREVIOUS_VERDICTS=previous/verdicts.json" >> "$GITHUB_ENV"
          fi

      - name: review
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERDICTS_OUT: verdicts.json
        run: python3 .brick-framework/tools/review.py

      # Uploaded even when the review blocked or failed, so the next round
      # remembers this one. Missing file (no lane ran) is not an error.
      - if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: review-verdicts-pr-${{ github.event.pull_request.number }}
          path: verdicts.json
          if-no-files-found: ignore
          overwrite: true
