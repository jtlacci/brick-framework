# Reusable semantic review for repositories built on this framework. The
# deterministic architecture linter runs first; Jev then judges only the
# meaning-level criteria in review/<lane>.md.
name: review

on:
  workflow_call:
    inputs:
      framework-ref:
        description: immutable framework revision to validate and review with
        type: string
        required: true
    secrets:
      TYPESAFE_API_KEY:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: require immutable framework revision
        env:
          FRAMEWORK_REF: ${{ inputs.framework-ref }}
        run: |
          if [[ ! "$FRAMEWORK_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "framework-ref must be a full 40-character commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: jtlacci/brick-framework
          ref: ${{ inputs.framework-ref }}
          path: .brick-framework

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: validate repository architecture
        run: python3 .brick-framework/tools/model_repository.py --root . --check

      # The last verdict for this PR is context for the next review round.
      - name: restore previous verdicts
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: review-verdicts-pr-${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${NAME}&per_page=1" \
               --jq '.artifacts[0].id // empty')
          if [ -n "$id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > previous.zip \
              && unzip -o -q previous.zip -d previous \
              && echo "PREVIOUS_VERDICTS=previous/verdicts.json" >> "$GITHUB_ENV"
          fi

      - name: review
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERDICTS_OUT: verdicts.json
        run: python3 .brick-framework/tools/review.py

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-verdicts-pr-${{ github.event.pull_request.number }}
          path: verdicts.json
          if-no-files-found: ignore
          overwrite: true
